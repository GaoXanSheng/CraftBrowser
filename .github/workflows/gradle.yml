name: Java CI with Gradle

on:
  push:
    branches: [ "1.20.1","1.21.1"]
  pull_request:
    branches: [ "1.20.1","1.21.1" ]

jobs:
  ncef:

    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Restore NCEF packages
      run: msbuild NCEF/NCEF/NCEF.csproj /t:restore /p:RestorePackagesConfig=true /v:minimal
    - name: Build NCEF
      run: msbuild NCEF/NCEF/NCEF.csproj /p:Configuration=Release /p:Platform=X64 /v:minimal
    - name: Upload NCEF
      uses: actions/upload-artifact@v4
      with:
        name: ncef-release
        path: NCEF/NCEF/bin/X64/Release/**
        if-no-files-found: error

  build:

    needs: ncef
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Download NCEF
      uses: actions/download-artifact@v4
      with:
        name: ncef-release
        path: NCEF/NCEF/bin/X64/Release
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Build with Gradle Wrapper
      run: ./gradlew build


  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
