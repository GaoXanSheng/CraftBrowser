architectury {
    common rootProject.enabled_platforms.split(',')
}
repositories {
    flatDir {
        dirs 'libs'
    }
}
dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

def ncefRelease = rootProject.file('NCEF/NCEF/bin/X64/Release')
def ncefStage = file("$buildDir/ncef-resources")
def ncefDest = file("$ncefStage/win64")

tasks.register('stageNcef') {
    outputs.upToDateWhen { false }
    doLast {
        delete ncefStage
        ncefDest.mkdirs()

        if (!ncefRelease.isDirectory()) {
            logger.warn("[craftbrowser] NCEF release output not found at ${ncefRelease}; the jar will not carry a bundled NCEF.")
            new File(ncefDest, 'files.txt').text = ''
            new File(ncefDest, 'version.txt').text = ''
            return
        }

        copy {
            from(ncefRelease) {
                exclude '**/*.xml', '**/*.pdb', '**/User Data/**', '**/logs/**'
            }
            into ncefDest
        }

        def root = ncefDest.toPath()
        def entries = []
        ncefDest.eachFileRecurse { f ->
            if (f.isFile()) {
                entries << root.relativize(f.toPath()).toString().replace('\\', '/')
            }
        }
        entries.sort()

        new File(ncefDest, 'files.txt').text = entries.join('\n') + '\n'

        def exe = new File(ncefRelease, 'NCEF.exe')
        def stamp = project.version.toString()
        if (exe.isFile()) {
            def digest = java.security.MessageDigest.getInstance('MD5').digest(exe.bytes)
            stamp = stamp + '+' + String.format('%08x', new java.math.BigInteger(1, digest).intValue())
        }
        new File(ncefDest, 'version.txt').text = stamp
        logger.lifecycle("[craftbrowser] staged ${entries.size()} NCEF files into ${ncefDest} (stamp ${stamp})")
    }
}

sourceSets.main.resources.srcDir ncefStage

def distDir = file('src/main/resources/dist')
def distIndex = file("$buildDir/generated/ncef-dist.txt")

tasks.register('distIndex') {
    inputs.dir(distDir)
    outputs.file(distIndex)
    doLast {
        distIndex.parentFile.mkdirs()
        def base = distDir.toPath()
        def entries = []
        if (distDir.isDirectory()) {
            distDir.eachFileRecurse { f ->
                if (f.isFile()) entries << base.relativize(f.toPath()).toString().replace('\\', '/')
            }
        }
        distIndex.text = entries.sort().join('\n') + '\n'
        logger.lifecycle("[craftbrowser] indexed ${entries.size()} dist files")
    }
}

tasks.named('processResources') {
    dependsOn 'stageNcef', 'distIndex'
    from(distIndex)
}
