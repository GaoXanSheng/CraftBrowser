<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* 强制 html 和 body 透明 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0) !important;
            background: transparent !important;
            overflow: hidden;
            font-family: sans-serif;
        }

        .test-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }

        /* 纯色方块 - Alpha 255 */
        .solid-box {
            width: 200px;
            height: 100px;
            background-color: #ff0000; /* 纯红 */
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        /* 半透明方块 - Alpha 128 (50%) */
        .alpha-box {
            width: 200px;
            height: 100px;
            background-color: rgba(0, 0, 255, 0.5); /* 半透明蓝 */
            border: 2px dashed #d4c19c;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            backdrop-filter: blur(5px); /* 注意：有些离屏渲染不支持滤镜，如果变黑请删掉这行 */
        }

        /* 动态测试 */
        .status-text {
            color: #d4c19c;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.3; transform: scale(1.1); }
        }

        .info {
            background: rgba(0,0,0,0.6);
            padding: 10px;
            color: #fff;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="test-wrapper">
    <div class="status-text">TRANSPARENCY TEST</div>

    <div class="solid-box">SOLID RED (A:255)</div>

    <div class="alpha-box">SEMI BLUE (A:128)</div>

    <div class="info">
        Background should be completely invisible.<br>
        If you see BLACK behind this, transparency failed.
    </div>
</div>
</body>
</html>
